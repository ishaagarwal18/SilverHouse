<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SilverHouse Studio - Luxury Silver Jewelry Catalog</title>

    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* HIGH-CONTRAST LIGHT LUXURY PALETTE (Cashmere Sand & Royal Midnight Sapphire) */
            --bg: #EAE2D5;                   /* Warm Cashmere Sand (rich, warm, NOT plain white) */
            --sidebar-bg: #DFD4C0;           /* Distinct tinted stone parchment sidebar */
            --surface: #F8F4EC;              /* Warm Alabaster Silk for cards (soft cream, high contrast) */
            --surface-card: #D8CCB9;         /* High-contrast chip & pill background */
            --surface-hover: #CDC0AC;        /* Hover state for interactive chips */
            --border: #C5B299;               /* Crisp warm taupe border for sharp definition */
            --border-focus: #0B2545;
            --primary: #0B2545;              /* Royal Midnight Sapphire - high contrast on light sand */
            --primary-hover: #143A66;
            --primary-glow: rgba(11, 37, 69, 0.2);
            --accent: #9A650C;               /* Heritage Burnished Gold */
            --accent-gold: #D4AF37;
            --success: #15803d;
            --danger: #b91c1c;
            --text-main: #071526;            /* Deep obsidian sapphire text (maximum contrast & legibility) */
            --text-muted: #4E6073;           /* Slate navy subtext */
            --sidebar-width: 300px;
            --radius: 16px;
            --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --input-bg: #EDE5D6;
            --input-text: #071526;
            --shadow: 0 4px 20px rgba(11, 37, 69, 0.08);
            --card-shadow: 0 6px 22px rgba(11, 37, 69, 0.09);
            --topbar-border: #C5B299;
            --bg-gradient: radial-gradient(circle at 50% 0%, rgba(11, 37, 69, 0.04), transparent 60%);
            --header-bg: rgba(223, 212, 192, 0.94);
            --card-media-bg: #DDD1BE;        /* Warm Pedestal plinth that makes 925 silver gleam */
        }

        [data-theme="dark"] {
            --bg: #07121E;
            --sidebar-bg: #0B192A;
            --surface: #0E2034;
            --surface-card: #152B44;
            --surface-hover: #1D3958;
            --border: #224266;
            --border-focus: #4B90D6;
            --primary: #4B90D6;
            --primary-hover: #60A5FA;
            --primary-glow: rgba(75, 144, 214, 0.3);
            --accent: #E5B25D;
            --accent-gold: #F5C77E;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #F4EFEB;
            --text-muted: #95A9BF;
            --input-bg: #152B44;
            --input-text: #F4EFEB;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
            --card-shadow: 0 4px 22px rgba(0, 0, 0, 0.4);
            --topbar-border: rgba(229, 178, 93, 0.15);
            --bg-gradient: radial-gradient(circle at 50% 0%, rgba(75, 144, 214, 0.08), transparent 50%);
            --header-bg: rgba(11, 25, 42, 0.94);
            --card-media-bg: #0A1624;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(11, 37, 69, 0.22);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(11, 37, 69, 0.38);
        }

        /* ================= SIDEBAR FILTER PANEL ================= */
        .sidebar-filter {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            background: var(--sidebar-bg, #DFD4C0);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 22px 20px;
            gap: 18px;
            z-index: 20;
            overflow-y: auto;
            height: 100vh;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #0B2545, #1B4573);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #F5E8C7;
            box-shadow: 0 4px 14px rgba(11, 37, 69, 0.25);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .btn-theme-toggle {
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 17px;
            transition: var(--transition);
        }

        .btn-theme-toggle:hover {
            background: var(--surface-hover);
            transform: scale(1.05);
        }

        .filter-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
            padding: 0 2px;
        }

        .filter-group-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .filter-field select,
        .filter-field input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--input-text);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }

        .filter-field select option {
            background: var(--surface);
            color: var(--text-main);
        }

        .filter-field select:focus,
        .filter-field input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .radio-item,
        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            color: var(--text-main);
        }

        .radio-item:hover,
        .checkbox-item:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .radio-item.active,
        .checkbox-item.active {
            background: var(--primary-glow);
            border-color: var(--primary);
            font-weight: 700;
        }

        .radio-item input[type="radio"],
        .checkbox-item input[type="checkbox"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .pill-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
        }

        .pill-btn:hover {
            background: var(--surface-hover);
        }

        .pill-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .count-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            background: var(--surface-hover);
            color: var(--text-muted);
        }

        /* ================= SINGLE TRACK DUAL-THUMB SLIDER ================= */
        .dual-slider-wrap {
            position: relative;
            height: 32px;
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 6px;
        }

        .dual-slider-track {
            position: absolute;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            z-index: 1;
        }

        .dual-slider-range {
            position: absolute;
            height: 6px;
            border-radius: 3px;
            background: var(--primary);
            z-index: 2;
        }

        .dual-slider-wrap input[type="range"] {
            position: absolute;
            width: 100%;
            height: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            pointer-events: none;
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
            padding: 0;
            border: none;
            z-index: 3;
        }

        .dual-slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--surface);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .dual-slider-wrap input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent);
        }

        .dual-slider-wrap input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.25);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .dual-slider-wrap input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--surface);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            pointer-events: auto;
        }

        .search-field {
            position: relative;
        }

        .search-field i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .search-field input {
            padding-left: 32px;
        }

        .btn-reset-sidebar {
            margin-top: 10px;
            width: 100%;
            background: rgba(185, 28, 28, 0.08);
            color: var(--danger);
            border: 1px solid rgba(185, 28, 28, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-reset-sidebar:hover {
            background: rgba(185, 28, 28, 0.16);
        }

        /* ================= MAIN CONTENT VIEW ================= */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-gradient);
            background-color: var(--bg);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 36px;
            border-bottom: 1px solid var(--topbar-border);
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .title-box h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .title-box p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-secondary {
            background: var(--surface-card);
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }

        .content-area {
            padding: 32px 36px;
            flex: 1;
        }

        /* ================= PRODUCTS GRID & CARDS ================= */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            gap: 26px;
            align-items: stretch;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 14px 28px rgba(11, 37, 69, 0.14);
        }

        .card-media {
            position: relative;
            width: 100%;
            height: 250px;
            background: var(--card-media-bg);
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .card-media img {
            transform: scale(1.05);
        }

        /* CORNER BADGES: Exactly 4 separate corners, strictly non-overlapping */
        .badge-discount {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, #DC2626, #991B1B);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 2;
            width: auto;
            height: auto;
            line-height: 1.2;
            pointer-events: none;
        }

        .badge-purity {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(11, 37, 69, 0.90);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.6);
            color: #F8E6C8;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.4px;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 2;
            width: auto;
            height: auto;
            line-height: 1.2;
            pointer-events: none;
        }

        .badge-finish {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(248, 244, 236, 0.96);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(11, 37, 69, 0.25);
            color: var(--primary);
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            z-index: 2;
            width: auto;
            height: auto;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }
        [data-theme="dark"] .badge-finish {
            background: rgba(14, 32, 52, 0.95);
            border-color: rgba(212, 175, 55, 0.4);
            color: #F8E6C8;
        }

        .badge-sold {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(154, 101, 12, 0.95);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            z-index: 2;
            width: auto;
            height: auto;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }

        /* CARD BODY */
        .card-body {
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 8px;
        }

        .product-kicker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .kicker-sep {
            color: var(--border);
        }

        .kicker-audience {
            color: var(--text-muted);
            font-weight: 600;
        }

        .product-title {
            font-size: 15.5px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        .product-social {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
        }

        .rating-stars {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #D97706;
            font-weight: 700;
        }

        .rating-stars i {
            color: #EAB308;
            font-size: 13px;
        }

        .review-count {
            color: var(--text-muted);
            font-weight: 500;
        }

        .social-sep {
            color: var(--border);
        }

        .sold-indicator {
            color: var(--text-muted);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .sold-indicator i {
            color: #EA580C;
        }

        .product-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .specs-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .spec-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .spec-pill i {
            color: var(--primary);
        }

        .price-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .price-wrap {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .final-price {
            font-size: 19px;
            font-weight: 800;
            color: var(--primary);
        }

        .original-price {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .stock-tag {
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .stock-tag.in-stock {
            background: rgba(21, 128, 61, 0.1);
            color: var(--success);
        }

        .stock-tag.out-of-stock {
            background: rgba(185, 28, 28, 0.1);
            color: var(--danger);
        }

        .stock-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .card-action {
            margin-top: 8px;
        }

        .btn-card-action {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary);
            padding: 9px 14px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-card-action:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 14px var(--primary-glow);
            transform: translateY(-1px);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Toast notifications */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR FILTER CONTROLS ================= -->
    <aside class="sidebar-filter">
        <div class="brand-header">
            <a href="/catalog" class="brand-box">
                <div class="brand-logo">
                    <i class="ph-bold ph-gem"></i>
                </div>
                <div>
                    <div class="brand-title">SilverHouse</div>
                    <div class="brand-subtitle">Jewelry Catalog</div>
                </div>
            </a>
            <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Light / Dark Mode">
                <i class="ph-bold ph-moon" id="sidebarThemeIcon"></i>
            </button>
        </div>

        <div class="filter-section-title">
            <span>Filter Catalog</span>
            <i class="ph-bold ph-faders"></i>
        </div>

        <div class="filter-group-list">
            <!-- 1. Search Query -->
            <div class="filter-field search-field">
                <label>Search Keyword</label>
                <i class="ph-bold ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search item, style..." oninput="applyAllFilters()" />
            </div>

            <!-- 2. Target Audience (Pill Buttons) -->
            <div class="filter-field">
                <label>Target Audience</label>
                <div class="pill-group" id="audiencePills">
                    <button class="pill-btn active" data-val="" onclick="setAudience('')">All</button>
                    <button class="pill-btn" data-val="Women" onclick="setAudience('Women')">Women</button>
                    <button class="pill-btn" data-val="Men" onclick="setAudience('Men')">Men</button>
                    <button class="pill-btn" data-val="Kids" onclick="setAudience('Kids')">Kids</button>
                    <button class="pill-btn" data-val="ALL" onclick="setAudience('ALL')">Unisex</button>
                </div>
            </div>

            <!-- 3. Signature Color / Finish Filter (Radio Group) -->
            <div class="filter-field">
                <label>Signature Color / Finish</label>
                <div class="radio-group" id="colorOptions"></div>
            </div>

            <!-- 4. Category Filter (Radio Group) -->
            <div class="filter-field">
                <label>Categories & Collections</label>
                <div class="radio-group" id="categoryOptions"></div>
            </div>

            <!-- 5. Silver Purity Filter (Radio Group) -->
            <div class="filter-field">
                <label>Silver Purity</label>
                <div class="radio-group" id="purityOptions"></div>
            </div>

            <!-- 6. Craft / Make Type Filter (Radio Group) -->
            <div class="filter-field">
                <label>Craft / Make Type</label>
                <div class="radio-group" id="makeOptions"></div>
            </div>

            <!-- 7. Price Filter (Single Track Dual-Thumb Slider) -->
            <div class="filter-field">
                <div style="display:flex; justify-content: space-between; align-items:center;">
                    <label>Price Range (To - From)</label>
                    <span id="priceValBadge" style="font-size:11.5px; font-weight:700; color:var(--primary);">₹0 - ₹1,00,000</span>
                </div>
                <div class="dual-slider-wrap">
                    <div class="dual-slider-track"></div>
                    <div class="dual-slider-range" id="sliderRangeHighlight" style="left:0%; width:100%;"></div>
                    <input type="range" id="minPriceInput" min="0" max="100000" step="500" value="0" oninput="onDualPriceInput('min', this.value)" />
                    <input type="range" id="maxPriceInput" min="0" max="100000" step="500" value="100000" oninput="onDualPriceInput('max', this.value)" />
                </div>
                <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); margin-top:2px;">
                    <span id="minPriceLabel">₹0</span>
                    <span>₹50,000</span>
                    <span id="maxPriceLabel">₹1,00,000</span>
                </div>
            </div>

            <!-- 8. Stock Availability Filter (Checkbox) -->
            <div class="filter-field">
                <label class="checkbox-item" id="stockCheckboxItem" style="margin-top:4px;">
                    <span style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="stockCheckbox" onchange="onStockToggle(this.checked)" />
                        <span>Ready in Stock Only</span>
                    </span>
                </label>
            </div>

            <!-- 9. Sort Order (Radio Group) -->
            <div class="filter-field">
                <label>Sort By Order</label>
                <div class="radio-group" id="sortOptions">
                    <label class="radio-item active">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="default" checked
                                onchange="onSortRadioChange('default')" />
                            <span>Newest First</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="sold_desc"
                                onchange="onSortRadioChange('sold_desc')" />
                            <span>🔥 Top Sellers (Highest Sold)</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="price_asc"
                                onchange="onSortRadioChange('price_asc')" />
                            <span>Price: Low to High</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="price_desc"
                                onchange="onSortRadioChange('price_desc')" />
                            <span>Price: High to Low</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="discount_desc"
                                onchange="onSortRadioChange('discount_desc')" />
                            <span>Highest Discount</span>
                        </span>
                    </label>
                </div>
            </div>

            <button class="btn-reset-sidebar" onclick="resetFilters()">
                <i class="ph-bold ph-arrows-counter-clockwise"></i> Reset All Filters
            </button>
        </div>
    </aside>

    <!-- ================= MAIN PRODUCTS DISPLAY ================= -->
    <main class="main-wrapper">
        <header class="top-bar">
            <div class="title-box">
                <h1>Silver Jewelry Catalog</h1>
                <p id="catalogCount">Loading live inventory...</p>
            </div>

            <div class="top-actions">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeToggleBtn">
                    <i class="ph-bold ph-moon" id="themeIcon"></i>
                    <span id="themeToggleText">Dark Mode</span>
                </button>
                <a href="/api/data" class="btn btn-secondary" title="Open Admin Studio Dashboard">
                    <i class="ph-bold ph-gear"></i>
                    <span>Admin Studio</span>
                </a>
            </div>
        </header>

        <div class="content-area">
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </main>

    <script>
        let allProducts = [];
        let filteredProducts = [];

        let selectedAudience = '';
        let selectedColor = '';
        let selectedCategory = '';
        let selectedPurity = '';
        let selectedMake = '';
        let minPrice = 0;
        let maxPrice = 100000;
        let stockOnly = false;
        let selectedSort = 'default';

        // Theme management with LocalStorage
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const themeIcon = document.getElementById('themeIcon');
            const themeToggleText = document.getElementById('themeToggleText');
            const sidebarThemeIcon = document.getElementById('sidebarThemeIcon');

            if (theme === 'dark') {
                if (themeIcon) themeIcon.className = 'ph-bold ph-sun';
                if (themeToggleText) themeToggleText.innerText = 'Light Mode';
                if (sidebarThemeIcon) sidebarThemeIcon.className = 'ph-bold ph-sun';
            } else {
                if (themeIcon) themeIcon.className = 'ph-bold ph-moon';
                if (themeToggleText) themeToggleText.innerText = 'Dark Mode';
                if (sidebarThemeIcon) sidebarThemeIcon.className = 'ph-bold ph-moon';
            }
        }

        async function fetchCatalogData() {
            try {
                const res = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proc_name: 'product', opr: 'SELECT' })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.status || json.error);

                allProducts = json.data || [];
                filteredProducts = [...allProducts];

                populateFilterOptions(allProducts);
                applyAllFilters();

            } catch (err) {
                console.error("Failed to fetch catalog:", err);
                document.getElementById('productsGrid').innerHTML = `
                    <div class="empty-state">
                        <i class="ph-bold ph-warning-circle" style="color: var(--danger);"></i>
                        <h3>Failed to Load Catalog</h3>
                        <p style="color:var(--text-muted); margin-top:6px;">${err.message}</p>
                    </div>
                `;
            }
        }

        function populateFilterOptions(products) {
            // Color / Signature Finish options
            const colorContainer = document.getElementById('colorOptions');
            if (colorContainer) {
                const finishes = [
                    { id: '', label: 'All Colors & Finishes' },
                    { id: 'Silver', label: 'Fine Silver' },
                    { id: 'Rose Gold', label: 'Rose Gold Plated' },
                    { id: 'Oxidised', label: 'Bold Oxidised' }
                ];
                let colorHTML = '';
                finishes.forEach(f => {
                    const count = f.id ? products.filter(p => (p.color || 'Silver').toLowerCase() === f.id.toLowerCase()).length : products.length;
                    const isChecked = selectedColor.toLowerCase() === f.id.toLowerCase();
                    colorHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="color_radio" value="${f.id}" ${isChecked ? 'checked' : ''} onchange="onColorRadioChange('${f.id}')" />
                                <span>${f.label}</span>
                            </span>
                            <span class="count-badge">${count}</span>
                        </label>
                    `;
                });
                colorContainer.innerHTML = colorHTML;
            }

            // Category options
            const catContainer = document.getElementById('categoryOptions');
            if (catContainer) {
                const getCatName = p => p.category_name || p.category || p.category_slug || '';
                const categories = [...new Set(products.map(getCatName).filter(Boolean))];
                let catHTML = `
                    <label class="radio-item ${!selectedCategory ? 'active' : ''}">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="category_radio" value="" ${!selectedCategory ? 'checked' : ''} onchange="onCategoryRadioChange('')" />
                            <span>All Categories</span>
                        </span>
                        <span class="count-badge">${products.length}</span>
                    </label>
                `;
                categories.forEach(c => {
                    const count = products.filter(p => getCatName(p) === c).length;
                    const isChecked = selectedCategory === c;
                    catHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="category_radio" value="${c}" ${isChecked ? 'checked' : ''} onchange="onCategoryRadioChange('${c}')" />
                                <span>${c}</span>
                            </span>
                            <span class="count-badge">${count}</span>
                        </label>
                    `;
                });
                catContainer.innerHTML = catHTML;
            }

            // Purity options
            const purityContainer = document.getElementById('purityOptions');
            if (purityContainer) {
                const purities = [...new Set(products.map(p => p.purity).filter(Boolean))];
                let purityHTML = `
                    <label class="radio-item ${!selectedPurity ? 'active' : ''}">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="purity_radio" value="" ${!selectedPurity ? 'checked' : ''} onchange="onPurityRadioChange('')" />
                            <span>All Purities</span>
                        </span>
                    </label>
                `;
                purities.forEach(pur => {
                    const isChecked = selectedPurity === pur;
                    purityHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="purity_radio" value="${pur}" ${isChecked ? 'checked' : ''} onchange="onPurityRadioChange('${pur}')" />
                                <span>${pur}</span>
                            </span>
                        </label>
                    `;
                });
                purityContainer.innerHTML = purityHTML;
            }

            // Make / Craft options
            const makeContainer = document.getElementById('makeOptions');
            if (makeContainer) {
                const makes = [...new Set(products.map(p => p.make_type).filter(Boolean))];
                let makeHTML = `
                    <label class="radio-item ${!selectedMake ? 'active' : ''}">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="make_radio" value="" ${!selectedMake ? 'checked' : ''} onchange="onMakeRadioChange('')" />
                            <span>All Crafts / Makes</span>
                        </span>
                    </label>
                `;
                makes.forEach(m => {
                    const isChecked = selectedMake === m;
                    makeHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="make_radio" value="${m}" ${isChecked ? 'checked' : ''} onchange="onMakeRadioChange('${m}')" />
                                <span>${m}</span>
                            </span>
                        </label>
                    `;
                });
                makeContainer.innerHTML = makeHTML;
            }
        }

        function setAudience(aud) {
            selectedAudience = aud;
            document.querySelectorAll('#audiencePills .pill-btn').forEach(btn => {
                if (btn.getAttribute('data-val') === aud) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            applyAllFilters();
        }

        function onColorRadioChange(val) {
            selectedColor = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onCategoryRadioChange(val) {
            selectedCategory = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onPurityRadioChange(val) {
            selectedPurity = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onMakeRadioChange(val) {
            selectedMake = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onDualPriceInput(handle, val) {
            val = Number(val);
            const minInput = document.getElementById('minPriceInput');
            const maxInput = document.getElementById('maxPriceInput');
            const highlight = document.getElementById('sliderRangeHighlight');
            const badge = document.getElementById('priceValBadge');
            const minLabel = document.getElementById('minPriceLabel');
            const maxLabel = document.getElementById('maxPriceLabel');

            if (handle === 'min') {
                minPrice = Math.min(val, maxPrice - 500);
                if (minInput) minInput.value = minPrice;
                if (minInput && maxInput) {
                    minInput.style.zIndex = '5';
                    maxInput.style.zIndex = '4';
                }
            } else {
                maxPrice = Math.max(val, minPrice + 500);
                if (maxInput) maxInput.value = maxPrice;
                if (minInput && maxInput) {
                    maxInput.style.zIndex = '5';
                    minInput.style.zIndex = '4';
                }
            }

            const minPercent = (minPrice / 100000) * 100;
            const maxPercent = (maxPrice / 100000) * 100;

            if (highlight) {
                highlight.style.left = minPercent + '%';
                highlight.style.width = (maxPercent - minPercent) + '%';
            }

            if (badge) {
                badge.innerText = `₹${minPrice.toLocaleString('en-IN')} - ₹${maxPrice.toLocaleString('en-IN')}`;
            }
            if (minLabel) minLabel.innerText = `₹${minPrice.toLocaleString('en-IN')}`;
            if (maxLabel) maxLabel.innerText = `₹${maxPrice.toLocaleString('en-IN')}`;

            applyAllFilters();
        }

        function onStockToggle(checked) {
            stockOnly = checked;
            const item = document.getElementById('stockCheckboxItem');
            if (item) {
                if (checked) item.classList.add('active');
                else item.classList.remove('active');
            }
            applyAllFilters();
        }

        function onSortRadioChange(val) {
            selectedSort = val;
            document.querySelectorAll('#sortOptions .radio-item').forEach(lbl => {
                const radio = lbl.querySelector('input[type="radio"]');
                if (radio && radio.value === val) {
                    lbl.classList.add('active');
                } else {
                    lbl.classList.remove('active');
                }
            });
            applyAllFilters();
        }

        function renderProductCards(products) {
            const grid = document.getElementById('productsGrid');
            const countElem = document.getElementById('catalogCount');
            grid.innerHTML = '';

            countElem.innerText = `Showing ${products.length} exclusive silver pieces`;

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <h3>No Products Found</h3>
                        <p style="color:var(--text-muted); margin-top:6px;">No products match your selected filters. Try changing or resetting your filters.</p>
                    </div>
                `;
                return;
            }

            products.forEach(p => {
                let imgUrl = '';
                if (p.images && p.images.length > 0) {
                    const firstImg = p.images[0];
                    if (typeof firstImg === 'object' && firstImg !== null) {
                        imgUrl = firstImg.image_url || firstImg.url || '';
                    } else if (typeof firstImg === 'string') {
                        imgUrl = firstImg;
                    }
                } else if (p.image_url) {
                    imgUrl = p.image_url;
                }

                const hasDiscount = p.discount && Number(p.discount) > 0;
                const effectivePrice = p.final_price !== undefined ? Number(p.final_price) : Number(p.price);
                const finalPriceFormatted = effectivePrice.toLocaleString('en-IN');
                const origPriceFormatted = Number(p.price).toLocaleString('en-IN');
                const inStock = p.quantity && Number(p.quantity) > 0;

                const productName = p.product_name || p.title || p.name || 'Silver Jewelry Item';
                const catName = p.category_name || p.category || p.category_slug || 'Silver';
                const productColor = p.color || 'Silver';
                const productSold = p.sold || 450;
                const productReview = p.review || 48;
                const productAudience = p.ideal_for || 'Unisex';

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="card-media">
                        ${hasDiscount ? `<span class="badge-discount">${p.discount}% OFF</span>` : ''}
                        <span class="badge-purity">${p.purity || '92.5'} Fine</span>
                        <span class="badge-finish"><i class="ph-bold ph-sparkle"></i> ${productColor}</span>
                        <span class="badge-sold"><i class="ph-bold ph-flame"></i> ${productSold}+ Sold</span>
                        <img src="${imgUrl}" alt="${productName}" loading="lazy" />
                    </div>

                    <div class="card-body">
                        <div class="product-kicker">
                            <span>${catName.toUpperCase()}</span>
                            <span class="kicker-sep">•</span>
                            <span class="kicker-audience">${productAudience}</span>
                        </div>

                        <h3 class="product-title" title="${productName}">${productName}</h3>

                        <div class="product-social">
                            <span class="rating-stars">
                                <i class="ph-fill ph-star"></i>
                                <strong>4.9</strong>
                                <span class="review-count">(${productReview} reviews)</span>
                            </span>
                            <span class="social-sep">•</span>
                            <span class="sold-indicator"><i class="ph-bold ph-trend-up"></i> Trending</span>
                        </div>

                        <p class="product-desc">${p.description || 'Authentic pure handcrafted sterling silver treasure piece.'}</p>

                        <div class="specs-row">
                            <span class="spec-pill"><i class="ph-bold ph-scales"></i> ${p.weight || 'Fine Silver'}</span>
                            ${p.make_type ? `<span class="spec-pill"><i class="ph-bold ph-hammer"></i> ${p.make_type}</span>` : ''}
                        </div>

                        <div class="price-section">
                            <div class="price-wrap">
                                <span class="final-price">₹${finalPriceFormatted}</span>
                                ${hasDiscount ? `<span class="original-price">₹${origPriceFormatted}</span>` : ''}
                            </div>
                            <span class="stock-tag ${inStock ? 'in-stock' : 'out-of-stock'}">
                                <span class="stock-dot"></span>
                                ${inStock ? `${p.quantity} In Stock` : 'Sold Out'}
                            </span>
                        </div>

                        <div class="card-action">
                            <button class="btn-card-action" onclick="showCatalogToast('${productName.replace(/'/g, "\\'")}', '₹${finalPriceFormatted}')">
                                <i class="ph-bold ph-shopping-bag"></i> Add to Bag
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showCatalogToast(itemName, itemPrice) {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerHTML = `
                <i class="ph-fill ph-check-circle" style="color:var(--success); font-size:20px;"></i>
                <div>
                    <div><strong>${itemName}</strong></div>
                    <div style="font-size:11.5px; color:var(--text-muted);">${itemPrice} • Added to shopping bag</div>
                </div>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function applyAllFilters() {
            const searchQueryInput = document.getElementById('searchInput');
            const searchQuery = searchQueryInput ? searchQueryInput.value.toLowerCase().trim() : '';

            filteredProducts = allProducts.filter(p => {
                // 1. Search Query Filter
                const matchesSearch = !searchQuery ||
                    (p.product_name && p.product_name.toLowerCase().includes(searchQuery)) ||
                    (p.description && p.description.toLowerCase().includes(searchQuery)) ||
                    (p.color && p.color.toLowerCase().includes(searchQuery));

                // 2. Strict Audience Filter
                const pAudience = (p.ideal_for || '').trim();
                const matchesAudience = !selectedAudience || (pAudience.toLowerCase() === selectedAudience.toLowerCase());

                // 3. Color Filter
                const pColor = (p.color || 'Silver').toLowerCase();
                const matchesColor = !selectedColor || (pColor === selectedColor.toLowerCase());

                // 4. Category Filter
                const matchesCategory = !selectedCategory || (p.category_name === selectedCategory || p.category === selectedCategory);

                // 5. Purity Filter
                const matchesPurity = !selectedPurity || p.purity === selectedPurity;

                // 6. Make Filter
                const matchesMake = !selectedMake || p.make_type === selectedMake;

                // 7. Dual-Thumb Single-Track Price Filter
                const effectivePrice = p.final_price !== undefined ? Number(p.final_price) : Number(p.price);
                const matchesPrice = effectivePrice >= minPrice && effectivePrice <= maxPrice;

                // 8. Stock Availability Filter
                const matchesStock = !stockOnly || Number(p.quantity) > 0;

                return matchesSearch && matchesAudience && matchesColor && matchesCategory && matchesPurity && matchesMake && matchesPrice && matchesStock;
            });

            // Sorting
            if (selectedSort === 'sold_desc') {
                filteredProducts.sort((a, b) => Number(b.sold || 0) - Number(a.sold || 0));
            } else if (selectedSort === 'price_asc') {
                filteredProducts.sort((a, b) => (a.final_price || a.price) - (b.final_price || b.price));
            } else if (selectedSort === 'price_desc') {
                filteredProducts.sort((a, b) => (b.final_price || b.price) - (a.final_price || a.price));
            } else if (selectedSort === 'discount_desc') {
                filteredProducts.sort((a, b) => (b.discount || 0) - (a.discount || 0));
            } else {
                filteredProducts.sort((a, b) => b.product_id - a.product_id);
            }

            renderProductCards(filteredProducts);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            selectedAudience = '';
            selectedColor = '';
            selectedCategory = '';
            selectedPurity = '';
            selectedMake = '';
            minPrice = 0;
            maxPrice = 100000;
            stockOnly = false;
            selectedSort = 'default';

            const minInput = document.getElementById('minPriceInput');
            if (minInput) minInput.value = 0;
            const maxInput = document.getElementById('maxPriceInput');
            if (maxInput) maxInput.value = 100000;

            const highlight = document.getElementById('sliderRangeHighlight');
            if (highlight) {
                highlight.style.left = '0%';
                highlight.style.width = '100%';
            }

            const priceValBadge = document.getElementById('priceValBadge');
            if (priceValBadge) priceValBadge.innerText = '₹0 - ₹1,00,000';
            const minLabel = document.getElementById('minPriceLabel');
            if (minLabel) minLabel.innerText = '₹0';
            const maxLabel = document.getElementById('maxPriceLabel');
            if (maxLabel) maxLabel.innerText = '₹1,00,000';

            const stockCheckbox = document.getElementById('stockCheckbox');
            if (stockCheckbox) stockCheckbox.checked = false;

            const stockItem = document.getElementById('stockCheckboxItem');
            if (stockItem) stockItem.classList.remove('active');

            // Reset pill buttons
            document.querySelectorAll('#audiencePills .pill-btn').forEach(btn => {
                if (btn.getAttribute('data-val') === '') btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Reset sort radio
            document.querySelectorAll('#sortOptions .radio-item').forEach(lbl => {
                const radio = lbl.querySelector('input[type="radio"]');
                if (radio && radio.value === 'default') {
                    radio.checked = true;
                    lbl.classList.add('active');
                } else {
                    if (radio) radio.checked = false;
                    lbl.classList.remove('active');
                }
            });

            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        initTheme();
        fetchCatalogData();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category Form - SilverHouse Studio Admin</title>

    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #f1f5f9;
            --surface-hover: #e2e8f0;
            --border: #e2e8f0;
            --border-focus: #6366f1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.2);
            --accent: #0284c7;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --sidebar-width: 260px;
            --radius: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --input-bg: #ffffff;
            --input-text: #0f172a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --topbar-border: #e2e8f0;
            --bg-gradient: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 40%);
            --nav-hover-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-card: #1f2937;
            --surface-hover: #374151;
            --border: #374151;
            --border-focus: #6366f1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent: #38bdf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1f2937;
            --input-text: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --topbar-border: rgba(255, 255, 255, 0.05);
            --bg-gradient: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent 40%);
            --nav-hover-bg: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 32px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .btn-theme-toggle {
            margin-left: auto;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
        }

        .btn-theme-toggle:hover {
            background: var(--surface-hover);
            transform: scale(1.05);
        }

        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 0 8px 8px;
            font-weight: 600;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text-main);
            transform: translateX(3px);
        }

        .nav-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-gradient);
            background-color: var(--bg);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid var(--topbar-border);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .title-box h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .title-box p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface-card);
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }

        .content-area {
            padding: 32px;
            flex: 1;
        }

        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            max-width: 580px;
            margin: 0 auto 40px auto;
            animation: fadeIn 0.3s ease-in-out;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 14px;
            color: var(--input-text);
            font-size: 13.5px;
            outline: none;
            transition: var(--transition);
        }

        .form-group select option {
            background: var(--surface);
            color: var(--text-main);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            background: #064e3b;
            color: #a7f3d0;
            border: 1px solid #059669;
        }

        .toast-error {
            background: #450a0a;
            color: #fecaca;
            border: 1px solid #dc2626;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <i class="ph-bold ph-gem"></i>
            </div>
            <div>
                <div class="brand-title">SilverHouse</div>
                <div class="brand-subtitle">Studio Studio</div>
            </div>
            <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Light / Dark Mode">
                <i class="ph-bold ph-moon" id="sidebarThemeIcon"></i>
            </button>
        </div>

        <div>
            <div class="nav-label">Database Schemas</div>
            <ul class="nav-menu">
                <a href="index.html?entity=product" class="nav-item">
                    <i class="ph-bold ph-shopping-bag"></i>
                    <span>Products</span>
                </a>
                <a href="/index.html?entity=category" class="nav-item active">
                    <i class="ph-bold ph-squares-four"></i>
                    <span>Categories</span>
                </a>
                <a href="index.html?entity=image" class="nav-item">
                    <i class="ph-bold ph-image"></i>
                    <span>Images</span>
                </a>
                <a href="index.html?entity=make_master" class="nav-item">
                    <i class="ph-bold ph-wrench"></i>
                    <span>Make Master</span>
                </a>
                <a href="index.html?entity=product_image" class="nav-item">
                    <i class="ph-bold ph-link"></i>
                    <span>Product Images</span>
                </a>
            </ul>
        </div>
    </aside>

    <main class="main-wrapper">
        <header class="top-bar">
            <div class="top-bar-left">
                <a href="/index.html?entity=category" class="btn btn-secondary">
                    <i class="ph-bold ph-arrow-left"></i>
                    <span>Back to Categories</span>
                </a>
                <div class="title-box">
                    <h1 id="pageTitle">Add Category</h1>
                    <p id="pageDescription">Enter category details to save into database</p>
                </div>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeToggleBtn"
                    title="Toggle Light / Dark Mode">
                    <i class="ph-bold ph-moon" id="themeIcon"></i>
                    <span id="themeToggleText">Dark Mode</span>
                </button>
            </div>
        </header>

        <div class="content-area">
            <div class="form-card">
                <form id="categoryForm" onsubmit="submitForm(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Category Name *</label>
                            <input type="text" name="name" id="nameInput" required placeholder="e.g. Silver Bangles"
                                oninput="autoSlug(this.value)" />
                        </div>
                        <div class="form-group">
                            <label>Slug *</label>
                            <input type="text" name="slug" id="slugInput" required placeholder="e.g. silver-bangles" />
                        </div>
                        <div class="form-group">
                            <label>Description *</label>
                            <textarea name="description" rows="3" required
                                placeholder="Description of category..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Ideal For</label>
                            <select name="ideal_for">
                                <option value="Women">Women</option>
                                <option value="Men">Men</option>
                                <option value="ALL">ALL</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="/index.html?entity=category" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const themeIcon = document.getElementById('themeIcon');
            const themeToggleText = document.getElementById('themeToggleText');
            const sidebarThemeIcon = document.getElementById('sidebarThemeIcon');

            if (theme === 'dark') {
                if (themeIcon) themeIcon.className = 'ph-bold ph-sun';
                if (themeToggleText) themeToggleText.innerText = 'Light Mode';
                if (sidebarThemeIcon) sidebarThemeIcon.className = 'ph-bold ph-sun';
            } else {
                if (themeIcon) themeIcon.className = 'ph-bold ph-moon';
                if (themeToggleText) themeToggleText.innerText = 'Dark Mode';
                if (sidebarThemeIcon) sidebarThemeIcon.className = 'ph-bold ph-moon';
            }
        }

        function autoSlug(val) {
            if (!editId) {
                document.getElementById('slugInput').value = val.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            }
        }

        async function initForm() {
            initTheme();

            if (editId) {
                document.getElementById('pageTitle').innerText = `Edit Category (#${editId})`;
                document.getElementById('pageDescription').innerText = `Update category details`;
                loadExistingCategoryData(editId);
            }
        }

        async function loadExistingCategoryData(id) {
            try {
                const res = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proc_name: 'category', opr: 'SELECT', condition: String(id) })
                });
                const result = await res.json();
                const row = (result.data && result.data.length > 0) ? result.data[0] : null;

                if (row) {
                    const form = document.getElementById('categoryForm');
                    Object.keys(row).forEach(key => {
                        if (form.elements[key]) {
                            form.elements[key].value = row[key] !== null && row[key] !== undefined ? row[key] : '';
                        }
                    });
                }
            } catch (err) {
                showToast('Error loading record: ' + err.message, true);
            }
        }

        async function submitForm(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const table_values = {};

            formData.forEach((value, key) => {
                if (value.trim() !== '') {
                    table_values[key] = !isNaN(value) && value !== '' ? Number(value) : value;
                }
            });

            const payload = {
                proc_name: 'category',
                opr: editId ? 'EDIT' : 'ADD',
                table_values: table_values,
                condition: editId ? String(editId) : null
            };

            try {
                const res = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (!result.success) throw new Error(result.status || result.error);

                let targetId = editId;
                if (!targetId && result.data && result.data.length > 0) {
                    targetId = result.data[0].NewCategoryId || result.data[0].category_id || table_values.category_id;
                }
                const action = editId ? 'edit' : 'add';

                showToast('Category saved successfully!');
                setTimeout(() => {
                    window.location.href = `/index.html?entity=category${targetId ? `&highlightId=${targetId}&action=${action}` : ''}`;
                }, 1000);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.className = `toast show ${isError ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `<i class="ph-bold ${isError ? 'ph-warning-circle' : 'ph-check-circle'}"></i> <span>${msg}</span>`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        initForm();
    </script>
</body>

</html>
